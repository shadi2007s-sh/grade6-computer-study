<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 6 Computer • Podcast Studio</title><style>
:root{--navy:#17283d;--red:#bb3543;--teal:#147c85;--cream:#fff9f1;--line:#e2e7ec}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,Arial;background:#f3f6fa;color:var(--navy)}header{background:linear-gradient(120deg,#182b45,#185f71);color:white;padding:25px max(20px,calc((100vw - 1050px)/2))}header h1{margin:0;font-size:clamp(25px,4vw,38px)}header p{margin:4px 0 0}main{max-width:1050px;margin:auto;padding:20px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 22px}.tabs button,.btn{border:0;border-radius:12px;background:#e3eaf0;color:var(--navy);padding:12px 17px;font-weight:700;cursor:pointer}.tabs button.active,.btn.primary{background:var(--teal);color:white}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin:14px 0;box-shadow:0 5px 15px #17283d08}h2,h3{line-height:1.3}h2{color:#a92738}h3{color:#136c76}.pill{display:inline-block;background:#e9f5f5;color:#176a70;padding:3px 10px;border-radius:30px;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{color:#56687a;font-size:14px}.concept{background:var(--cream);padding:13px 17px;border-left:4px solid #e3a746;border-radius:8px;margin:10px 0}.q{padding:16px;border:1px solid var(--line);border-radius:12px;margin:13px 0}.choice{display:block;margin:8px 0;padding:10px;border-radius:8px;background:#f3f6f8;cursor:pointer}.choice:has(input:checked){background:#d9f0f0}.feedback{padding:12px;border-radius:10px;margin-top:9px;background:#edf7ee}.bad{background:#fff0ed}.bar{height:12px;background:#e7edf0;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:var(--teal)}button:disabled{opacity:.5;cursor:not-allowed}footer{text-align:center;padding:30px;color:#687789}input[type=text]{padding:10px;border:1px solid #bbc8d2;border-radius:9px;max-width:100%}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #e6eaef;text-align:left}details{background:#f5f8fa;padding:12px;border-radius:9px;margin:8px 0}summary{cursor:pointer;font-weight:700}@media print{header,.tabs,.btn{display:none!important}.card{break-inside:avoid}}
</style></head><body><header><h1>🎙️ Grade 6 Computer • Podcast Studio</h1><p>Study all six textbook lessons • practise • take an exam • track progress</p></header><main><nav class="tabs" id="tabs"></nav><section id="app"></section></main><footer>Study content based on the uploaded textbook pages 16–39 • Progress is stored on this device and sent securely online when Firebase is configured.</footer><script>
const lessons=[
{id:'1.1',title:'Plan a podcast',pages:'16–19',sections:[['What is a podcast?','A podcast is an audio programme that may include speech and music. A podcaster uses an audio editor or digital audio workstation (DAW) to record, edit and combine audio. Podcasts may be streamed so listeners can hear them on demand.'],['The three planning ideas','Aim = the purpose: what should listeners know, understand or feel? Objectives = tasks and content needed to achieve the aim. Constraints = limits that cannot be changed, such as length, deadline or equipment availability.'],['Podcast styles','Presentation: solo (one speaker), co-hosting (several speakers), or interview (questions for a guest). Location: in a studio or on location with a portable device. Mood: formal and informative or informal and entertaining.'],['Outline plan','An outline organises segments and their content. Common segments are introduction, jingle, topic segment and closing remarks. Consider the audience, timing, music and sound effects.'],['Script','A script contains some or all of the exact words to say. Write like you speak, use short sentences and everyday words, and avoid jargon.']],questions:[['What does DAW mean?',['Digital Audio Workstation','Digital Art Website','Direct Audio Wave','Digital Access Window'],0,'A DAW is the audio editing software used to record and combine sounds.'],['Which is a constraint?',['The purpose of the podcast','A five-minute time limit','A guest’s opinion','The introduction'],1,'Constraints are limits, such as time and equipment availability.'],['Which presentation style asks a guest questions?',['Solo','Co-hosting','Interview','On location'],2,'An interview involves a guest answering questions.'],['What does an outline plan show?',['The exact words only','The order and content of segments','Only the music volume','The file format'],1,'An outline structures the podcast and describes its segments.'],['What is a script?',['A sound effect','A list of equipment','Some or all of the exact words to say','A volume meter'],2,'A script gives the presenter words to say.']]},
{id:'1.2',title:'Record digital audio',pages:'20–23',sections:[['How digital sound works','Sound travels through the air as sound waves. Sound waves vibrate a microphone diaphragm; the microphone turns the vibrations into an electrical signal. A digital device converts the signal into digital data. Speakers or headphones change electrical signals back into sound waves.'],['Audio file formats','WAV: high-quality audio and often large files. MP3, MP4 and M4A: compressed audio, smaller files, with some quality loss. FLAC: lossless compression reduces file size without losing audio quality.'],['Microphones','An external condenser microphone can capture high-quality audio but is sensitive to background noise. A headset microphone is near one speaker’s mouth. Internal laptop, tablet or phone microphones can capture speech but may include background noise.'],['DAW basics','A multi-track project uses multiple tracks containing clips. The DAW displays waveforms on a timeline. Transport controls include Record, Play, Stop and Skip to start. A level meter helps control the recording level.'],['Recording levels and test','If levels are too low, audio is quiet; too high and it may distort. The textbook recommends speaking normally and setting the green recording meter to around two-thirds. Record a one-minute test, listen back and note improvements.']],questions:[['What vibrates when sound reaches a microphone?',['A waveform','A diaphragm','A file format','A timeline'],1,'The diaphragm vibrates in response to sound waves.'],['Which format uses lossless compression?',['MP3','M4A','FLAC','MP4'],2,'FLAC reduces size without loss of audio quality.'],['Which file type is often large and high-quality?',['WAV','MP3','M4A','MP4'],0,'WAV stores audio accurately and can produce large files.'],['What does a level meter help you check?',['The recording sound level','The podcast title','The deadline','The audience age'],0,'The meter shows audio levels so recordings are not too quiet or distorted.'],['What does a waveform represent in a DAW?',['An audio signal over time','The file name','A guest list','A copyright licence'],0,'The DAW displays recorded audio as waveforms on a timeline.']]},
{id:'1.3',title:'Record and edit digital audio',pages:'24–27',sections:[['Record segments','Record each segment on a separate DAW track to make editing and arranging easier. Set up in a quiet place, use your plan and script, practise, then record.'],['Mono tracks','A mono track uses one audio channel. In the textbook’s Audacity example, add a new mono track using the Tracks menu. Select the track and place the cursor before recording.'],['Trim unwanted audio','Trimming removes unwanted sounds at the start or end, including silence before speaking or after stopping. Select unwanted audio and remove it.'],['Edit carefully','Listen back and find mistakes. Looped playback repeats a selected section; Zoom magnifies the waveform for more accurate edits. Select the unwanted section and delete it.'],['Move clips','After trimming, clips may have gaps or overlaps. Drag the top panel of a clip left or right to move it along the timeline. Listen after each edit to make sure the result sounds good.']],questions:[['Why record segments on separate tracks?',['To make editing easier','To stop all sound','To reduce the number of clips','To avoid planning'],0,'Separate tracks make it easier to arrange and edit segments.'],['How many channels does mono audio use?',['Two','Three','One','Four'],2,'A mono track contains one audio channel.'],['What does trimming remove?',['Only music','Unwanted audio at the beginning or end','All tracks','File names'],1,'Trimming removes unwanted sounds or silence at the edges.'],['What does looped playback do?',['Exports audio','Repeats a selected section','Changes pitch','Adds a guest'],1,'Looped playback repeats the selected part for checking edits.'],['What helps you make more accurate edits?',['Zooming into the waveform','Increasing all volume','Deleting the project','Removing the timeline'],0,'Zoom magnifies the waveform for precise selection.']]},
{id:'1.4',title:'Finish a podcast',pages:'28–31',sections:[['Jingles and sound effects','A jingle is short, memorable music associated with a podcast. Import an audio file into the DAW and position it on the timeline. A stereo file has left and right channels.'],['Using music fairly','Look for Creative Commons or royalty-free content, check its licence conditions, and credit the creator and music title in the script or show notes.'],['Audio effects','Reverb imitates sound reflecting from surfaces. Echo/delay repeats audio after a short gap. Pitch shift raises or lowers pitch. Fade in gradually raises volume; fade out gradually lowers it.'],['Effect settings','Parameters are settings you change to customise an effect. Select the audio to edit, choose an effect, preview it and apply it. Avoid making speech unclear.'],['Mixing','Mixing balances the volume of speech, music and effects across tracks. Adjust track volume sliders or use the Mixer. Check transitions and avoid sudden volume differences.']],questions:[['What is a jingle?',['A short memorable music segment','A microphone','A file extension','A waveform'],0,'A jingle is short music that identifies the podcast.'],['How many channels are in stereo audio?',['One','Two','Three','Four'],1,'Stereo audio has left and right channels.'],['Which effect repeats audio after a short gap?',['Reverb','Pitch shift','Echo','Fade in'],2,'Echo or delay repeats sound after a short gap.'],['Which effect gradually lowers volume?',['Fade in','Fade out','Pitch shift','Reverb'],1,'Fade out gradually decreases the volume.'],['What does mixing mean?',['Balancing track volumes','Writing a script','Choosing a guest','Recording a test'],0,'Mixing balances speech, music and effects so they sound right together.']]},
{id:'1.5',title:'Share a podcast',pages:'32–35',sections:[['Export your podcast','Export creates a sound file from the DAW project so you can share it. Choose an appropriate format: MP3 uses compression to keep files small; WAV is usually larger with little or no compression.'],['Show notes','Show notes give listeners extra information. They may include links, images, names of interview guests and background information.'],['Share your work','Podcast services can stream or allow downloads. For classwork, the teacher may suggest email or the school network.'],['Collect feedback','Ask listeners about the content, audience suitability, interest, clarity, speaking speed and background noise. A feedback form can have questions for each segment and space for comments.'],['Use feedback well','Ask open questions and be helpful and friendly when reviewing others’ work. Feedback helps improve the pilot episode and later episodes.']],questions:[['What does exporting do?',['Creates a shareable sound file','Adds a new guest','Removes all speech','Changes the podcast aim'],0,'Exporting produces an audio file from the project.'],['Which format is commonly used for a smaller podcast file?',['WAV','MP3','An outline','A script'],1,'MP3 compression creates smaller files suitable for sharing.'],['What belongs in show notes?',['Useful links and guest details','Only recording levels','Only the waveform','The microphone diaphragm'],0,'Show notes can contain links, images and information about guests.'],['Why ask listeners for feedback?',['To improve the podcast','To increase the file size','To remove the timeline','To make stereo mono'],0,'Feedback identifies what works and what needs improvement.'],['Which question checks technical quality?',['Is the presenter speaking clearly?','What is your favourite colour?','How old is your computer?','What is the file name?'],0,'Speech clarity is a technical quality concern.']]},
{id:'1.6',title:'Improve your podcast',pages:'36–39',sections:[['Analyse feedback','Read listeners’ comments and suggestions. Turn a comment into an action: “The music sounded sad” could become “find happier music.”'],['Prioritise changes','First fix big mistakes and technical problems. Next tackle difficult, time-consuming changes. Last make small, less important quick changes.'],['Troubleshoot','Troubleshooting means finding causes and correcting them. Check possible causes one at a time. If speech is quiet, raise speech or lower music. If distorted, check levels.'],['Useful audio tools','Mute temporarily silences a track to isolate problems; Solo plays a track alone; Normalize can smooth volume differences; a high-pass filter around 80–120 Hz may reduce low-frequency rumble.'],['Save and review','Save a new version, such as “Podcast v2”, before editing. Make improvements in priority order, listen to the result, and describe how the changes made a difference.']],questions:[['What is troubleshooting?',['Finding and correcting causes of problems','Adding a title','Writing show notes','Choosing a location'],0,'Troubleshooting is the process of locating and fixing problems.'],['Which problem should be fixed first?',['A small cosmetic change','The most important technical problem','A minor title change','The easiest change'],1,'The textbook prioritises big mistakes and technical problems.'],['How can you hear one track alone?',['Solo','Import','Export','Fade in'],0,'Solo isolates a track for listening.'],['What can reduce low-frequency rumble?',['High-pass filter','Pitch shift only','A new script','An outline plan'],0,'A high-pass filter reduces low-frequency sounds such as rumble.'],['Why save a new version?',['To protect the original project','To increase volume automatically','To delete feedback','To add a microphone'],0,'A new version preserves the original in case edits go wrong.']]}];
const tfBank=[["1.1","A podcast may include speech and music.",true],["1.1","A constraint is the purpose of a podcast.",false],["1.2","FLAC uses lossless compression.",true],["1.2","Very high recording levels can cause distortion.",true],["1.3","Mono audio has two channels.",false],["1.3","Zooming helps accurate waveform edits.",true],["1.4","Fade out increases volume gradually.",false],["1.4","Mixing balances volume across tracks.",true],["1.5","Show notes may include guest information.",true],["1.5","Exporting only saves an editable project.",false],["1.6","Troubleshooting means finding and fixing problems.",true],["1.6","Saving a new version protects the original.",true]];const matchBank=[["1.1","Aim","Purpose of the podcast"],["1.1","Constraint","Limit such as time or equipment"],["1.2","Diaphragm","Microphone part that vibrates"],["1.2","FLAC","Lossless compressed audio format"],["1.3","Mono","One audio channel"],["1.3","Trimming","Remove unwanted audio at start or end"],["1.4","Jingle","Short memorable podcast music"],["1.4","Fade out","Gradually reduce volume"],["1.5","Export","Create a shareable audio file"],["1.5","Show notes","Extra information and links for listeners"],["1.6","Solo","Play one track alone"],["1.6","Troubleshooting","Find and correct problems"]];const STORE='grade6-podcast-v1';let state;try{state=JSON.parse(localStorage.getItem(STORE))||{done:{},attempts:[]}}catch(e){state={done:{},attempts:[]}};let tab='home',activeQuiz=null,answers={};const app=document.querySelector('#app'),tabs=document.querySelector('#tabs');function save(){localStorage.setItem(STORE,JSON.stringify(state))}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){let items=[['home','🏠 Home'],['lessons','📚 Lessons'],['exam','📝 Final Exam'],['parent','📊 Parent Dashboard']];tabs.innerHTML=items.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}function go(t){tab=t;activeQuiz=null;nav();render();window.scrollTo(0,0)}function render(){if(tab==='home')home();if(tab==='lessons')lessonList();if(tab==='exam')examPage();if(tab==='parent')parentPage()}function home(){let completed=Object.values(state.done).filter(Boolean).length;app.innerHTML=`<div class="card"><h2>Welcome to Podcast Studio!</h2><p>Learn all six lessons from the Grade 6 Computer textbook, pages 16–39. Study the explanations, then try each five-question practice quiz. When you are ready, take the 30-question final exam.</p><div class="pill">${completed} of 6 lessons completed</div><div class="bar" style="margin:15px 0"><div style="width:${completed/6*100}%"></div></div><button class="btn primary" onclick="go('lessons')">Start studying →</button></div><div class="grid">${lessons.map(l=>`<div class="card"><span class="pill">Lesson ${l.id} · pages ${l.pages}</span><h3>${l.title}</h3><p class="small">${state.done[l.id]?'✓ Marked as studied':'Not yet marked as studied'}</p><button class="btn" onclick="openLesson('${l.id}')">Open lesson</button></div>`).join('')}</div>`}function lessonList(){app.innerHTML=`<h2>All lessons</h2><div class="grid">${lessons.map(l=>`<div class="card"><span class="pill">${l.id}</span><h3>${l.title}</h3><p class="small">Textbook pages ${l.pages}</p><button class="btn primary" onclick="openLesson('${l.id}')">Study lesson</button></div>`).join('')}</div>`}function openLesson(id){tab='lessons';nav();let l=lessons.find(x=>x.id===id);app.innerHTML=`<button class="btn" onclick="lessonList()">← All lessons</button><div class="card"><span class="pill">Lesson ${l.id} · pages ${l.pages}</span><h2>${l.title}</h2><p class="small">Read each section and try to explain it aloud in your own words.</p>${l.sections.map(([title,body],i)=>`<div class="concept"><h3>${i+1}. ${title}</h3><p>${escapeHTML(body)}</p></div>`).join('')}<button class="btn primary" onclick="markDone('${id}')">${state.done[id]?'✓ Studied — review complete':'✓ Mark lesson as studied'}</button> <button class="btn" onclick="startQuiz('${id}')">Take 5-question quiz →</button></div>`;window.scrollTo(0,0)}function markDone(id){state.done[id]=true;save();sendCloudEvent('studied',{lesson:id});openLesson(id)}function startQuiz(id){let l=lessons.find(x=>x.id===id);activeQuiz={kind:'lesson',id,questions:l.questions.map((q,i)=>({id:id+'-'+i,q:q[0],options:q[1],correct:q[2],why:q[3]}))};answers={};quizView()}function examPage(){app.innerHTML=`<div class="card"><h2>Final Exam — All 6 Lessons</h2><p>54 questions: 30 multiple choice, 12 True/False, and 12 matching questions across all six lessons. The questions and answer choices are shuffled for each attempt. Submit to see your score, mistakes, and revision recommendations.</p><p class="small">No time limit. Results are stored in this browser for the parent dashboard.</p><button class="btn primary" onclick="startExam()">Start final exam</button></div>`}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function startExam(){let mc=lessons.flatMap(l=>l.questions.map((a,i)=>({id:l.id+'-'+i,lesson:l.id,q:a[0],options:a[1],correct:a[2],why:a[3],type:'mc'})));mc=shuffle(mc).map(a=>{let opts=shuffle(a.options.map((label,i)=>({label,i})));return {...a,options:opts.map(o=>o.label),correct:opts.findIndex(o=>o.i===a.correct)}});let tf=shuffle(tfBank.map((a,i)=>({id:'tf'+i,lesson:a[0],q:a[1],options:['True','False'],correct:a[2]?0:1,type:'tf',why:a[2]?'This statement is true.':'This statement is false.'})));let matching=shuffle(matchBank.map((a,i)=>({id:'match'+i,lesson:a[0],q:a[1],definition:a[2],type:'match'})));activeQuiz={kind:'exam',id:'final',questions:[...mc,...tf,...matching],definitions:shuffle(matching.map(a=>({id:a.id,text:a.definition})))};answers={};quizView()}
function quizView(){let x=activeQuiz;app.innerHTML=`<div class="card"><h2>${x.kind==='exam'?'Comprehensive Final Exam':'Lesson '+x.id+' Practice Quiz'}</h2><p class="small">${x.kind==='exam'?'30 Multiple Choice • 12 True/False • 12 Matching':'Choose one answer per question.'} • Submit to reveal answers.</p><div id="quizQuestions">${x.questions.map((a,i)=>`<div class="q"><b>${i+1}. ${a.type==='match'?'Match: ':''}${escapeHTML(a.q)}</b>${a.type==='match'?`<p><select style="width:100%;max-width:650px;padding:12px" onchange="if(this.value){answers[${i}]=this.value}else{delete answers[${i}]};updateCount()"><option value="">Choose the matching definition</option>${x.definitions.map(d=>`<option value="${d.id}">${escapeHTML(d.text)}</option>`).join('')}</select></p>`:a.options.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" onchange="answers[${i}]=${j};updateCount()"> ${escapeHTML(o)}</label>`).join('')}</div>`).join('')}</div><p id="answeredCount"></p><button class="btn primary" onclick="submitQuiz()">Submit and see results</button></div>`;updateCount();window.scrollTo(0,0)}
function updateCount(){let el=document.getElementById('answeredCount');if(el&&activeQuiz)el.textContent=`Answered ${Object.keys(answers).length} of ${activeQuiz.questions.length}`}
function submitQuiz(){let x=activeQuiz;if(Object.keys(answers).length!==x.questions.length){alert('Please answer every question before submitting.');return}let correct=(a,i)=>a.type==='match'?answers[i]===a.id:answers[i]===a.correct;let score=x.questions.filter((a,i)=>correct(a,i)).length,percent=Math.round(score/x.questions.length*100);let record={kind:x.kind,lesson:x.kind==='lesson'?x.id:null,date:new Date().toISOString(),score,total:x.questions.length,percent,missed:x.questions.filter((a,i)=>!correct(a,i)).map(a=>({lesson:a.lesson||x.id,question:a.q}))};state.attempts.unshift(record);save();sendCloudEvent('quiz',{kind:record.kind,lesson:record.lesson,score:record.score,total:record.total,percent:record.percent,missed:record.missed});let weak=[...new Set(record.missed.map(a=>a.lesson))];let breakdown=x.kind==='exam'?['mc','tf','match'].map(t=>{let a=x.questions.map((q,i)=>({q,i})).filter(z=>z.q.type===t);return `<p><b>${t==='mc'?'Multiple choice':t==='tf'?'True/False':'Matching'}:</b> ${a.filter(z=>correct(z.q,z.i)).length}/${a.length}</p>`}).join(''):'';app.innerHTML=`<div class="card"><h2>Results: ${score}/${x.questions.length} (${percent}%)</h2><div class="bar"><div style="width:${percent}%"></div></div>${breakdown}<p><b>Recommended review:</b> ${weak.length?weak.map(id=>'Lesson '+id).join(', '):'No weak areas.'}</p><h3>Answer review</h3>${x.questions.map((a,i)=>{let ok=correct(a,i),selected=a.type==='match'?x.definitions.find(d=>d.id===answers[i])?.text:a.options[answers[i]],right=a.type==='match'?a.definition:a.options[a.correct];return `<details ${ok?'':'open'}><summary>${ok?'✓':'✗'} ${i+1}. ${escapeHTML(a.q)}</summary><p>Your answer: ${escapeHTML(selected||'')}</p><p>Correct answer: <b>${escapeHTML(right)}</b></p><p>${escapeHTML(a.why||'Review the definition in this lesson.')}</p></details>`}).join('')}<button class="btn primary" onclick="${x.kind==='exam'?'startExam()':`startQuiz('${x.id}')`}">Try again</button> <button class="btn" onclick="go('parent')">Parent dashboard</button></div>`;window.scrollTo(0,0)}
function downloadResults(){let rows=[['Date','Assessment','Lesson','Score','Total','Percentage','Missed questions'],...state.attempts.map(a=>[a.date,a.kind,a.lesson||'all',a.score,a.total,a.percent,a.missed.map(x=>`[${x.lesson}] ${x.question}`).join(' | ')])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='grade6_computer_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

const firebaseConfig={apiKey:"AIzaSyCCK5RHo-PX5S_giV9wCcZaRkNDotry7yM",authDomain:"grade6-computer-study.firebaseapp.com",projectId:"grade6-computer-study",storageBucket:"grade6-computer-study.firebasestorage.app",messagingSenderId:"824605296249",appId:"1:824605296249:web:429b5fe17945ec7759b6a8"};
let cloud=null,cloudError='',parentUser=null;
async function setupCloud(){
 try{
  const [a,b,c]=await Promise.all([
   import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),
   import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),
   import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')]);
  const appFirebase=a.initializeApp(firebaseConfig),auth=b.getAuth(appFirebase),db=c.getFirestore(appFirebase);
  cloud={auth,db,...b,...c};
  b.onAuthStateChanged(auth,u=>{parentUser=u&&!u.isAnonymous?u:null;if(tab==='parent')parentPage()});
  if(!auth.currentUser)await b.signInAnonymously(auth);
 }catch(e){cloudError=e.message;console.warn('Cloud not ready:',e)}
}
async function sendCloudEvent(type,data){
 if(!cloud||!cloud.auth.currentUser||!cloud.auth.currentUser.isAnonymous)return;
 try{await cloud.addDoc(cloud.collection(cloud.db,'tala_events'),{type,student:'Tala',createdAt:cloud.serverTimestamp(),...data})}
 catch(e){cloudError=e.message;console.warn('Cloud save failed:',e)}
}
async function parentSignIn(){
 if(!cloud){alert('Firebase unavailable: '+cloudError);return}
 const email=document.getElementById('parentEmail').value.trim(),password=document.getElementById('parentPassword').value;
 try{await cloud.signInWithEmailAndPassword(cloud.auth,email,password);parentPage()}
 catch(e){alert('Login failed. Check your email, password and Firebase Authentication settings.')}
}
async function parentSignOut(){
 if(cloud){await cloud.signOut(cloud.auth);await cloud.signInAnonymously(cloud.auth)}parentUser=null;parentPage()
}
async function parentPage(){
 if(!cloud){app.innerHTML='<div class="card"><h2>Parent dashboard</h2><p>Firebase connection is not ready. '+escapeHTML(cloudError||'Loading…')+'</p></div>';return}
 if(!parentUser){
 app.innerHTML='<div class="card"><h2>🔒 Parent dashboard — Tala</h2><p>Only the parent can see online results. Sign in with your Firebase parent account.</p><p><input id="parentEmail" type="email" placeholder="Parent email" autocomplete="username" style="padding:10px;max-width:100%;width:300px"></p><p><input id="parentPassword" type="password" placeholder="Password" autocomplete="current-password" style="padding:10px;max-width:100%;width:300px"></p><button class="btn primary" onclick="parentSignIn()">Sign in</button><p class="small">Parent account must be created in Firebase Authentication. A password is never stored in the website.</p></div>';return}
 app.innerHTML='<div class="card"><h2>Tala — Online Parent Dashboard</h2><p>Loading results…</p></div>';
 try{
  const snapshot=await cloud.getDocs(cloud.query(cloud.collection(cloud.db,'tala_events'),cloud.orderBy('createdAt','desc'),cloud.limit(300)));
  const events=snapshot.docs.map(d=>d.data()),attempts=events.filter(e=>e.type==='quiz'),done=new Set(events.filter(e=>e.type==='studied').map(e=>e.lesson));
  const best=attempts.filter(e=>e.kind==='exam').map(e=>e.percent);
  app.innerHTML='<div class="card"><h2>📊 Tala — Online Parent Dashboard</h2><p><b>Lessons studied:</b> '+done.size+'/6</p><p><b>Quiz/exam attempts:</b> '+attempts.length+'</p><p><b>Best final exam:</b> '+(best.length?Math.max(...best)+'%':'Not taken')+'</p><button class="btn" onclick="parentSignOut()">Sign out</button><h3>Recent results</h3>'+(attempts.length?'<table><tr><th>Date</th><th>Assessment</th><th>Score</th></tr>'+attempts.slice(0,50).map(e=>'<tr><td>'+escapeHTML(e.createdAt?.toDate?.().toLocaleString()||'Pending')+'</td><td>'+escapeHTML(e.kind==='exam'?'Final exam':'Lesson '+e.lesson)+'</td><td>'+e.score+'/'+e.total+' ('+e.percent+'%)</td></tr>').join('')+'</table>':'<p>No online results yet.</p>')+'<h3>Most recent mistakes</h3>'+(attempts[0]?.missed?.length?'<ul>'+attempts[0].missed.map(m=>'<li>Lesson '+escapeHTML(m.lesson)+': '+escapeHTML(m.question)+'</li>').join('')+'</ul>':'<p>No recent mistakes recorded.</p>')+'</div>';
 }catch(e){app.innerHTML='<div class="card"><h2>Parent dashboard</h2><p>Unable to load results: '+escapeHTML(e.message)+'</p><button class="btn" onclick="parentSignOut()">Sign out</button></div>'}
}
setupCloud();
nav();render();
</script></body></html>
